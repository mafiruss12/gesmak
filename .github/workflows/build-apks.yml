name: Build GESMAK APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'
    branches:
      - main
    paths:
      - '.github/workflows/build-apks.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'scripts/build-apk-both.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & build web
        run: |
          npm install --legacy-peer-deps
          npm run build:mobile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor sync
        run: |
          npx cap sync android
          bash scripts/inject-android-permissions.sh || true

      - name: Gradle APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleTerrainDebug assembleAdminDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out-apk
          cp android/app/build/outputs/apk/terrain/debug/*.apk out-apk/GESMAK-terrain-debug.apk
          cp android/app/build/outputs/apk/admin/debug/*.apk out-apk/GESMAK-admin-debug.apk
          ls -lh out-apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gesmak-apks
          path: out-apk/*.apk
          retention-days: 14

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: GESMAK APKs (terrain + admin)
          body: |
            ## APK à installer
            - **GESMAK-terrain-debug.apk** — app utilisateurs (`com.gesmak.app`)
            - **GESMAK-admin-debug.apk** — console admin (`com.gesmak.admin`)

            Pointent vers https://gesmak.vercel.app
          files: |
            out-apk/GESMAK-terrain-debug.apk
            out-apk/GESMAK-admin-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
