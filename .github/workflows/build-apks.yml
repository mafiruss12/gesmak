name: Build GESMAK APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install & build web
        run: |
          npm install --legacy-peer-deps
          npm run build:mobile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SM=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
          yes | "$SM" --licenses || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Capacitor sync
        run: |
          npx cap sync android
          bash scripts/inject-android-permissions.sh || true

      - name: Gradle APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assemblePrimaryDebug assemblePlusDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out-apk
          find android/app/build/outputs/apk -name '*.apk' -print
          cp android/app/build/outputs/apk/primary/debug/*.apk out-apk/GESMAK.apk
          cp android/app/build/outputs/apk/plus/debug/*.apk out-apk/GESMAK-plus.apk
          ls -lh out-apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gesmak-apks
          path: out-apk/*.apk
          retention-days: 14
