name: Build GESMAK Native (Kotlin) APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-kotlin-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate wrapper if needed
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2 || true
          fi
          # Official wrapper jar bootstrap
          if [ ! -f gradlew ]; then
            curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle.zip
            ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Assemble debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Pass to gradle as project properties
          ./gradlew :app:assembleDebug \
            -PSUPABASE_URL="${SUPABASE_URL:-}" \
            -PSUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --no-daemon --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p ../out-apk
          cp app/build/outputs/apk/debug/*.apk ../out-apk/GESMAK-native.apk
          ls -lh ../out-apk

      - uses: actions/upload-artifact@v4
        with:
          name: gesmak-native-apk
          path: out-apk/GESMAK-native.apk
          retention-days: 14
