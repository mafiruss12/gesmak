name: Sauvegarde nocturne de la base (gratuite)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer pg_dump v17 (meme version majeure que Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Exporter la base (pg_dump)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          STAMP=$(date +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f "backups/backup-$STAMP.dump"

      - name: Committer la sauvegarde dans le depot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B db-backups
          git add backups/
          git commit -m "backup: sauvegarde automatique $(date +%Y-%m-%d)" || echo "Rien de nouveau"
          git push origin db-backups --force

      - name: Purger les sauvegardes de plus de 30 jours
        run: |
          find backups -name '*.dump' -mtime +30 -delete || true
